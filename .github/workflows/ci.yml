name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Real browsers against the real server, Postgres and Redis. CI has no Ollama, so this runs the
    # polling suite with AI turned off; the AI suite (e2e/ai.spec.ts) is run locally with Ollama.
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: classpulse, POSTGRES_PASSWORD: classpulse, POSTGRES_DB: classpulse }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U classpulse" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AI_ENABLED: "false"
      JWT_SECRET: ci-secret-not-for-production
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start server and web
        run: |
          npm run start -w @classpulse/server > server.log 2>&1 &
          npm run dev -w @classpulse/web > web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:5000/health http://localhost:5173
      - run: npm run e2e -- polling.spec
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
            server.log
            web.log
