<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ClassPulse: live classroom polls with a private, local AI teaching assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1240"/>
      <stop offset="0.55" stop-color="#2a1458"/>
      <stop offset="1" stop-color="#4a1446"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="0.5" stop-color="#b14bff"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6d4aff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.55">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow2)"/>

  <!-- pulse line -->
  <path d="M880 308 H1010 l14 -26 l16 48 l20 -78 l18 56 l12 0 H1280" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- logo -->
  <rect x="80" y="78" width="88" height="88" rx="26" fill="url(#brand)"/>
  <path d="M152 122h-14l-10 30l-20 -60l-10 30h-14" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="196" y="140" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">ClassPulse</text>
  <text x="82" y="222" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#e9e4ff">Live classroom polls with a private AI teaching assistant</text>
  <text x="82" y="258" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#b9addf">that runs on your own machine. No API keys. No per-token bills.</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff">
    <rect x="82" y="290" width="178" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="171" y="313" text-anchor="middle">⚡ Socket.IO</text>
    <rect x="272" y="290" width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="372" y="313" text-anchor="middle">🦙 Ollama · qwen2.5</text>
    <rect x="484" y="290" width="196" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="582" y="313" text-anchor="middle">🧭 5 RAG strategies</text>
    <rect x="692" y="290" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="772" y="313" text-anchor="middle">🐘 pgvector</text>
  </g>

  <!-- mini poll card -->
  <g transform="translate(930 58)">
    <rect width="290" height="196" rx="20" fill="#ffffff" fill-opacity="0.96"/>
    <text x="20" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b2ee0">● LIVE · Q3</text>
    <text x="20" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#17142b">Where is the Calvin cycle?</text>
    <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#17142b">
      <rect x="20" y="76" width="250" height="26" rx="8" fill="#efedf7"/><rect x="20" y="76" width="160" height="26" rx="8" fill="#6d4aff" fill-opacity="0.25" stroke="#12b76a" stroke-width="2"/>
      <text x="30" y="94">A  Stroma</text><text x="258" y="94" text-anchor="end">64%</text>
      <rect x="20" y="108" width="250" height="26" rx="8" fill="#efedf7"/><rect x="20" y="108" width="54" height="26" rx="8" fill="#ff4d8d" fill-opacity="0.25"/>
      <text x="30" y="126">B  Thylakoid</text><text x="258" y="126" text-anchor="end">21%</text>
      <rect x="20" y="140" width="250" height="26" rx="8" fill="#efedf7"/><rect x="20" y="140" width="24" height="26" rx="8" fill="#12b76a" fill-opacity="0.25"/>
      <text x="30" y="158">C  Mitochondria</text><text x="258" y="158" text-anchor="end">9%</text>
    </g>
    <text x="20" y="186" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b14bff">✦ AI insight ready · running locally</text>
  </g>
</svg>
